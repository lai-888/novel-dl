[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "novel-dl"
version = "1.1.0"
description = "小说下载器：断点续传 / 增量更新 / 战术跳过"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["novel", "scraper", "downloader", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Text Processing :: Markup :: HTML",
]
dependencies = [
    "requests>=2.28",
    "beautifulsoup4>=4.11",
    "lxml>=4.9",
]

[project.optional-dependencies]
selenium = ["selenium>=4.10"]

[project.scripts]
novel-dl = "novel_dl.__main__:main"

[project.urls]
Homepage = "https://github.com/lai-888/novel-dl"
Issues = "https://github.com/lai-888/novel-dl/issues"

[tool.setuptools]
packages = ["novel_dl"]
